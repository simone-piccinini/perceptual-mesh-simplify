<svg xmlns="http://www.w3.org/2000/svg" width="875" height="427" viewBox="0 0 875 427" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Compression per test case at its judge-pinned wall. Case 3 reaches only 70.1% while the other five reach 85.9 to 99.3%.">
<rect width="875" height="427" rx="10" fill="#fcfcfb"/>
<text x="22" y="36" font-size="19" font-weight="600" fill="#0b0b0b">Where the score comes from</text>
<text x="22" y="57" font-size="11.5" fill="#52514e">Compression per hidden test case at its judge-pinned wall &#8212; five cases are near-maxed, one is not.</text>
<text x="853" y="40" text-anchor="end" font-size="29" font-weight="600" fill="#0b0b0b">90.28</text>
<text x="853" y="57" text-anchor="end" font-size="10.5" fill="#52514e">mean of the six &#183; 7/7 accepted</text>
<line x1="250.0" y1="82" x2="250.0" y2="348" stroke="#cfcec9" stroke-width="1"/>
<text x="250.0" y="366" text-anchor="middle" font-size="10" fill="#6f6e6a">0</text>
